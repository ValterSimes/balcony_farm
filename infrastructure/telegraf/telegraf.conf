[agent]
  interval = "10s"
  flush_interval = "10s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://algarrobo:1883"]
  topics = ["farm/+/sensors"]
  data_format = "json"
  json_string_fields = ["device"]
  json_time_key = "timestamp"
  json_time_format = "2006-01-02T15:04:05Z"
  name_override = "sensor_readings"

[[outputs.postgresql]]
  connection = "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}?sslmode=disable"